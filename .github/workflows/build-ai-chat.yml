name: Build ai-chat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.13113456"

      - name: Build ai-chat
        run: |
          cd llama.cpp/examples/llama.android
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Find ai-chat library
        run: |
          find llama.cpp/examples/llama.android -type f -name "libai-chat.so" -print

      - name: Upload ai-chat library
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-libs
          path: "**/libai-chat.so"
          if-no-files-found: error
